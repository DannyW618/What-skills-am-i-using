<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <title>The band folded, then opened into the full order and one row per plugin or MCP server</title>
  <style>
    .dim { fill: #8b949e } .fg { fill: #e6edf3 } .ok { fill: #3fb950 } .bad { fill: #f85149 } .acc { fill: #d97757 }
    .b { font-weight: 700 }
    /* One 12 s loop: folded for 3.5 s, a press on the button, then the rows open one by one. */
    .folded { animation: folded 12s infinite }
    .press { animation: press 12s infinite }
    .row { opacity: 0; animation: row 12s infinite }
    .r2 { animation-delay: .15s } .r3 { animation-delay: .3s } .r4 { animation-delay: .45s }
    .d2 { animation: d2 1.2s infinite } .d3 { animation: d3 1.2s infinite }
    .caret { animation: blink 1.1s steps(1) infinite }
    @keyframes folded { 0%, 31% { opacity: 1 } 34%, 96% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes press { 0%, 26% { fill: #21262d } 28%, 32% { fill: #d97757 } 34%, 100% { fill: #21262d } }
    @keyframes row { 0%, 33% { opacity: 0 } 37%, 86% { opacity: 1 } 90%, 100% { opacity: 0 } }
    @keyframes d2 { 0%, 33% { fill-opacity: 0 } 34%, 100% { fill-opacity: 1 } }
    @keyframes d3 { 0%, 66% { fill-opacity: 0 } 67%, 100% { fill-opacity: 1 } }
    @keyframes blink { 50% { opacity: 0 } }
  </style>
  <rect width="760" height="274" rx="10" fill="#0d1117"/>
  <circle cx="20" cy="18" r="5.5" fill="#f85149"/><circle cx="38" cy="18" r="5.5" fill="#d29922"/><circle cx="56" cy="18" r="5.5" fill="#3fb950"/>
  <text x="380" y="23" text-anchor="middle" class="dim" font-size="12">claude</text>
  <line x1="0" y1="36" x2="760" y2="36" stroke="#21262d"/>

  <!-- first line: the mark, the order of use ending at the latest, working dots; counts and the button at the right -->
  <path d="M20 68 H32 V56 Z" fill="#d97757"/><path d="M34 56 H46 L34 68 Z" fill="#e6edf3"/>
  <text x="56" y="66"><tspan class="dim">ponytail → navigate → </tspan><tspan class="acc b">Explore :</tspan><tspan class="acc b d2">:</tspan><tspan class="acc b d3">:</tspan></text>
  <text x="656" y="66" text-anchor="end" class="dim" font-size="12">2 skills · 1 subagent · 2 MCP tools</text>
  <rect class="press" x="668" y="50" width="72" height="24" rx="5" fill="#21262d"/>
  <text x="704" y="66" text-anchor="middle" class="fg folded">Show</text>
  <text x="704" y="66" text-anchor="middle" class="fg row">Hide</text>

  <!-- open: the full order, then one row per plugin or MCP server -->
  <rect class="row" x="12" y="84" width="736" height="116" rx="8" fill="none" stroke="#30363d"/>
  <text class="row" x="28" y="110"><tspan class="dim">order: humanizer → ponytail → read_page → navigate → </tspan><tspan class="acc b">Explore</tspan></text>
  <g class="row r2"><text x="28" y="134" class="fg b">Built-in subagents</text>
    <text x="300" y="134"><tspan class="acc b">:. </tspan><tspan class="fg b">Explore ×2</tspan></text></g>
  <g class="row r3"><text x="28" y="158" class="fg b">claude-in-chrome</text><text x="190" y="158" class="dim">MCP server</text>
    <text x="300" y="158"><tspan class="ok">✓ </tspan><tspan class="fg">navigate ×4</tspan><tspan class="bad">   ✗ </tspan><tspan class="fg">read_page ×2 (1 failed)</tspan></text></g>
  <g class="row r4"><text x="28" y="182" class="fg b">ponytail</text><text x="190" y="182" class="dim">plugin</text>
    <text x="300" y="182"><tspan class="ok">✓ </tspan><tspan class="fg">ponytail ×3</tspan><tspan class="ok">   ✓ </tspan><tspan class="fg">humanizer</tspan></text></g>

  <!-- the prompt -->
  <rect x="12" y="222" width="736" height="38" rx="6" fill="none" stroke="#30363d"/>
  <text x="26" y="246" class="dim">&gt; </text><rect class="caret" x="44" y="234" width="8" height="16" fill="#e6edf3"/>
</svg>
